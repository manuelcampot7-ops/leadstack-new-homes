name: Weekly Horton inventory
on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scrape D.R. Horton public pages
        run: node scripts/new-homes/sync.mjs --client=christina-martinez --output=christina-martinez.json
      - name: Publish JSON
        run: |
          git config user.name ezra
          git config user.email ezra@campo-os.local
          git add christina-martinez.json
          if git diff --cached --quiet; then
            echo "no inventory change"
            exit 0
          fi
          git commit -m "weekly Horton inventory $(date -u +%F)"
          git push
